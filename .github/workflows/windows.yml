name: Windows CI

on:
  push:
    branches: [ "master", "develop"  ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        build_type: [Release, Debug]
        c_compiler: [cl]

    env:
      CONAN_NON_INTERACTIVE: 1

    steps:
    - uses: actions/checkout@v4

    - name: Setup ccache
      uses: Chocobo1/setup-ccache-action@v1

    - name: Set up cache
      id: cache-cpm
      uses: actions/cache@v4
      with:
        path: ~/cpm-cache
        key: ${{ runner.os }}-cpm-${{ hashFiles('**/') }}
        restore-keys: |
          ${{ runner.os }}-cpm-a

    # Download VulkanAPI
    - name: Setup Vulkan
      uses: humbletim/setup-vulkan-sdk@523828e49cd4afabce369c39c7ee6543a2b7a735
      with:
        vulkan-query-version: latest
        vulkan-components: Vulkan-Headers Vulkan-Loader SPIRV-Headers SPIRV-Cross SPIRV-Tools SPIRV-Reflect Glslang
        vulkan-use-cache: true

    - name: Install Conan
      uses: conan-io/setup-conan@v1
      with:
        cache_packages: true

    - name: Setup local Conan index
      shell: bash
      run: |
        git clone --depth 1 https://github.com/4J-company/conan-center-index.git
        conan remote add 4J-company ./conan-center-index --type local-recipes-index

    - name: Build
      shell: pwsh
      run: |
        $env:CPM_SOURCE_CACHE = Join-Path $env:USERPROFILE "cpm-cache"
        New-Item -ItemType Directory -Force -Path $env:CPM_SOURCE_CACHE | Out-Null
        $show = conan profile show | Out-String
        if ($show -notmatch '(?m)^compiler\.version=(\S+)') { throw "Conan profile has no compiler.version" }
        $ver = $Matches[1]
        $runtime = "dynamic"
        if ($show -match '(?m)^compiler\.runtime=(\S+)') { $runtime = $Matches[1] }
        Write-Host "msvc version=$ver runtime=$runtime build=${{ matrix.build_type }}"
        conan build . -b missing `
          -s compiler=msvc `
          -s compiler.version=$ver `
          -s compiler.runtime=$runtime `
          -s compiler.runtime_type=${{ matrix.build_type }} `
          -s compiler.cppstd=23 `
          -s build_type=${{ matrix.build_type }}
